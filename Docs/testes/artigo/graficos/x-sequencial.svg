<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" role="img" aria-label="Limiar X da escada sequencial por configuração, em reservas por minuto por evento: pré-pooler 97k, ponto 1 78k, ponto 2 no Wi-Fi 56k, ponto 2 no cabo no mínimo 60k, ponto 3 intermediário 58k, rodada final 56k">
<title>Limiar X da escada sequencial por configuração</title>
<desc>Barras horizontais, uma série, em reservas por minuto por evento. O ponto 2 no cabo é só limite inferior. O teto do host intercalado da rodada final fica fora da série.</desc>
<style>
  :root { --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781; --grid:#e1e0d9; --baseline:#c3c2b7; --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root { --surface-1:#1a1a19; --text-primary:#ffffff; --text-secondary:#c3c2b7; --grid:#2c2c2a; --baseline:#383835; --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .bg { fill: var(--surface-1); }
  .titulo { fill: var(--text-primary); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--text-secondary); font-size: 12px; }
  .tp { fill: var(--text-primary); font-size: 13px; }
  .ts { fill: var(--text-secondary); font-size: 12px; }
  .tm { fill: var(--text-muted); font-size: 11px; }
  .val { fill: var(--text-primary); font-size: 13px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .base { stroke: var(--baseline); stroke-width: 1; }
  .s1 { fill: var(--series-1); } .s2 { fill: var(--series-2); } .s3 { fill: var(--series-3); }
  .oco { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-dasharray: 5 3; }
  .seta { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .teto { fill: none; stroke: var(--text-secondary); stroke-width: 2; }
  .div { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 3 4; }
  .hit { fill: transparent; pointer-events: all; }
</style>
<rect class="bg" width="900" height="470"/>
