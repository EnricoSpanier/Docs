<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Docs — Acesso negado</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

    :root {
      --chassis: #16181b;
      --panel: #202327;
      --panel-2: #262a2f;
      --edge: #34393f;
      --fault: #ff5449;
      --alu-1: #cfd3d6;
      --alu-2: #9ba0a5;
      --paper: #ece7d9;
      --paper-dim: #9b9484;
      --orange: #ff5a1f;
      --orange-hi: #ff7a45;
      --orange-skirt: #a53910;
      --orange-ink: #1c0e06;
      --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      --r: 10px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(1100px 700px at 18% -12%, #1e2226 0%, transparent 60%),
        repeating-linear-gradient(115deg, rgba(255,255,255,.015) 0 2px, transparent 2px 6px),
        var(--chassis);
      color: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--fault); color: #1c0503; }
    :focus-visible { outline: 2px solid var(--fault); outline-offset: 3px; }

    .panel {
      width: 100%;
      max-width: 380px;
      text-align: center;
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--edge);
      border-radius: 16px;
      padding: 34px 26px 28px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 24px 48px -24px rgba(0,0,0,.65);
      position: relative;
    }
    .panel::before, .panel::after {
      content: '';
      position: absolute;
      top: 12px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--alu-1), var(--alu-2));
    }
    .panel::before { left: 12px; }
    .panel::after { right: 12px; }

    .code {
      font-family: var(--mono);
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--fault);
      margin: 0;
    }
    .led-row { display: flex; justify-content: center; gap: 8px; margin: 12px 0 18px; }
    .led-row span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--fault);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.4), inset 0 -1px 1px rgba(0,0,0,.35);
    }

    h1 {
      font-family: var(--mono);
      font-size: .82rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--paper);
      margin: 0 0 12px;
    }
    p.explicacao {
      font-family: var(--sans);
      font-size: .88rem;
      line-height: 1.5;
      color: var(--paper-dim);
      margin: 0 0 24px;
    }

    .key {
      --face: var(--orange); --face-hi: var(--orange-hi); --skirt: var(--orange-skirt); --ink: var(--orange-ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5em;
      font-family: var(--mono);
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      text-decoration: none;
      font-size: .82rem;
      color: var(--ink);
      background: linear-gradient(180deg, var(--face-hi), var(--face) 55%);
      border-radius: var(--r);
      padding: .9em 1.3em;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.5),
        inset 0 -2px 0 rgba(0,0,0,.12),
        0 3px 0 var(--skirt),
        0 10px 16px -8px rgba(0,0,0,.6);
      transform: translateY(0);
      transition: transform .08s cubic-bezier(.2,.9,.3,1), box-shadow .08s cubic-bezier(.2,.9,.3,1), filter .15s ease;
    }
    .key:hover { filter: brightness(1.05); }
    .key:active {
      transform: translateY(3px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35),
        inset 0 -1px 0 rgba(0,0,0,.12),
        0 1px 0 var(--skirt),
        0 3px 6px -3px rgba(0,0,0,.5);
    }

    @media (max-width: 400px) {
      .panel { padding: 28px 18px 22px; }
      .code { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <p class="code">403</p>
    <div class="led-row" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1>Acesso negado</h1>
    <p class="explicacao">Sua conta está logada no hub, mas não tem acesso liberado a este site de documentação.</p>
    <a class="key" href="https://hub.enricospanier.com.br/login">&larr; Entrar de novo no hub</a>
  </div>
</body>
</html>
